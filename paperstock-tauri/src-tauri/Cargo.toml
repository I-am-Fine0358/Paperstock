[package]
name = "paperstock"
version = "2.0.0"
edition = "2021"

[lib]
name = "paperstock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# 2.11 adds native recovery when WebKit terminates its content process.
tauri = { version = "2.11.5", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
chrono = "0.4"
dirs = "6"
lopdf = "0.34"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "block2"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
